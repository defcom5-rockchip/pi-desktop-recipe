# Pi-Desktop mpv configuration. Measurements behind these settings: KNOWN-ISSUES.md (VID-5 to VID-7) and CHANGELOG.md.
# Never plain hwdec=auto: mpv would pick its own rkmpp path, whose bare NV15 output the GPU stack cannot import.
# Decoding: the recipe writes the line below for the installed driver and mpv. With rockchip-vaapi >= 2.5.0 and
# Pi-Desktop's mpv build it reads `hwdec=vaapi,vaapi-copy` (zero-copy first; that build draws 8- and 10-bit correctly
# on the Mali driver). With any other mpv it stays `hwdec=vaapi-copy`: Ubuntu's mpv draws 10-bit near-black on this GPU
# driver (VID-7), and drivers before 2.5.0 leaked decoder buffers on every abandoned zero-copy attempt.
hwdec=vaapi,vaapi-copy
# A profile or keypress that changes hwdec lasts for one file only; each new file starts from the line above.
reset-on-next-file=hwdec
# The Mali driver's Vulkan cannot present, and mpv's automatic renderer choice then falls back to software rendering.
gpu-api=opengl
# Audio output: PipeWire's own interface. Through the PulseAudio compatibility interface mpv read the audio clock
# coarsely enough that its frame dropper threw away 11-19 % of a 4K60 film on the KDE edition (KWin, Mesa) with the GPU
# idle; the PipeWire output measured 6 dropped frames at 4K60 and 52 at 1080p60 in the same 45 s test (2026-11-08). The
# sound still goes through PipeWire's mixer and its default output like every other application. ALSA (alsa-pipewire,
# 70 / 19 in that test) is the fallback for an mpv built without the PipeWire output (0.41.0+pd3 has none): without it
# such an mpv plays silently.
ao=pipewire,alsa
# Audio sync draws a frame only when the picture changes. display-resample redraws on every vsync, which at 4K@120 is
# more than the GPU can do with heavy 4K60 video (it fell behind real time). The disc profiles below use the same.
video-sync=audio
# Colour (chroma) upscaling: mpv's default (lanczos) on the colour planes of 4K60 video keeps the Mali-G610 saturated
# and drops frames; bilinear does not. Brightness (luma) scaling and dithering stay at mpv's defaults.
cscale=bilinear
# AV1 film grain: let the decoder apply it (Plaid Pi's MPP does it in hardware; dav1d in software). mpv's default
# hands grain to a libplacebo shader that does not compile on the Mali driver for 10-bit video (its luma plane is an
# integer texture here), which drops the grain and fails the first frame. Measured 2026-10-24.
vd-lavc-film-grain=cpu

# Discs: audio sync draws only when the picture changes, which leaves room for GPU deinterlacing of interlaced DVD video.
# mpv auto-loads protocol.<name> profiles (same sync as normal files; kept for the deinterlace setting).
# Films from network shares (GVFS, CIFS, NFS): mpv already turns its cache on for these filesystems; give it room to
# ride out a NAS pause even in high-bitrate scenes (the 150 MiB default is ~30 s at 40 Mbit/s). Local files are unaffected.
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB
cache-pause-wait=10

[protocol.dvd]
profile-desc=Pi-Desktop: DVDs (interlaced SD) - draw only when the picture changes, deinterlace when interlaced
video-sync=audio
deinterlace=auto

[protocol.bd]
profile-desc=Pi-Desktop: Blu-ray - draw only when the picture changes
video-sync=audio

[protocol.bluray]
profile=protocol.bd


# KDE edition only (Plaid Pi KDE runs KWin on Mesa/Panthor; the GNOME edition runs the Mali driver, where none of this was
# measured). Applied by mpv's auto-profile when the session says it is KDE. Measured on an Orange Pi 5 Plus, 4K60 H.264 on
# a 1080p60 output, 60 s runs, 2026-11-11: with the PipeWire output the defaults still dropped frames because (1) mpv waits
# for KWin's frame callback and then Mesa waits for it again, a frame late whenever the GPU is still busy, and (2) scaling 4K
# down to 1080p with mpv's default filters pins the GPU at 1 GHz. wayland-internal-vsync=no removes mpv's own wait; bilinear
# downscaling with correct-downscaling=no does what profile=fast does for the GPU (1 GHz -> 200 MHz) while keeping dithering
# and HDR peak detection. Both together: 0 dropped frames. On a 4K output nothing is downscaled and the scaling lines are inert.
[pidesktop-kde]
profile-desc=Plaid Pi KDE edition: frame pacing and cheaper 4K-to-1080p downscaling (measured 2026-11-11)
profile-cond=(os.getenv("XDG_CURRENT_DESKTOP") or ""):find("KDE") ~= nil
wayland-internal-vsync=no
dscale=bilinear
correct-downscaling=no
