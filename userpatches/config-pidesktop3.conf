# Plaid Pi 6.0 — Ubuntu 26.04 "Resolute" packages + GNOME 50 on the Rockchip vendor 6.1 (rkr7.2) kernel, Armbian framework
# Route B (2026-09-21). Run: sudo env PREFER_DOCKER=no ./compile.sh pidesktop3
BOARD="${PIDESKTOP_BOARD:-orangepi5b}"   # orangepi5b (default) or orangepi5: PIDESKTOP_BOARD=orangepi5 ./compile.sh … (2026-10-11)
BRANCH=vendor                 # rk-6.1-rkr7.2 @ 44bbd021 + upstream stable 6.1.189 (pinned source, hook below) + userpatches/kernel/rk35xx-vendor-6.1
RELEASE=resolute
BUILD_DESKTOP=yes
DESKTOP_ENVIRONMENT=gnome     # configng gnome.yaml (GNOME 50.1, gdm3)
DESKTOP_TIER=mid              # minimal/mid/full. mid since test9 (2026-10-02): full added LibreOffice, GIMP, Inkscape, Thunderbird,
                              # Audacity and Microsoft's VS Code build (telemetry on) and pushed the image past GitHub's 2 GiB release
                              # limit (test8 = 2.26 GB). Those apps now install on first click (customize-image.sh: pidesktop-get);
                              # Audacity is installed explicitly; VS Code is replaced by VSCodium.
BUILD_MINIMAL=no
KERNEL_CONFIGURE=no
INSTALL_HEADERS=yes
EXPERT=yes                    # orangepi5b is a .csc (community) board in current upstream (orangepi5 is a maintained .conf)
SHARE_LOGS=no
COMPRESS_OUTPUTIMAGE=sha,img
IMAGE_XZ_COMPRESSION_RATIO=1
PREFER_DOCKER=no              # native build on the resolute x86 host (host-release.sh lists resolute)

# Identity (framework knobs; the rest is done in customize-image.sh)
VENDOR="Pi-Desktop"
VENDORURL="https://defcom5-rockchip.github.io/pi-desktop/"
VENDORPRIVACY="https://defcom5-rockchip.github.io/pi-desktop/privacy.html"   # our own page (the framework default is duckduckgo.com)
VENDORLOGO="pi-desktop"       # icon name installed by customize-image.sh (branding/); the framework default is armbian-logo
VENDORSUPPORT="https://github.com/defcom5-rockchip"
VENDORDOCS="https://github.com/defcom5-rockchip/pi-desktop"
VENDORBUGS="https://github.com/defcom5-rockchip/pi-desktop/issues"
VENDORCOLOR="255;105;180"

# Our layer (read by customize-image.sh)
PIDESKTOP_VERSION="6.0"   # Plaid Pi 6.0: DRM in all three browsers, psd shutdown fix, Prime fix, MPP +pd35 film grain, mpv +pd3; 5.5 = VP9 fix + NAS playback; 5.0 = AV1
PIDESKTOP_GPU_STACK="mali"    # mali = libmali G610 g24p0 wayland-gbm (+ device-query shim) on kbase g29p1 (THE test); mesa = leave stock Mesa (llvmpipe control)

# Armbian's armbian-config extension (enabled unconditionally in main-config.sh) installs armbian-config AFTER
# customize-image.sh. Run after it in the same hook phase and take it back out, leaving apt lists clean.
# chroot_sdcard joins its args into ONE string and runs it via `bash -e -o pipefail -c` inside the rootfs, so the
# script is handed over as a single string and every fallible line carries `|| …` (which -e respects).
function post_armbian_repo_customize_image__zz_pidesktop_strip_armbian_config() {
	display_alert "Pi-Desktop" "purging armbian-config / armbian-zsh installed by framework hooks" "info"
	local script
	script=$(cat <<-'EOS'
		export DEBIAN_FRONTEND=noninteractive
		pk=$( { dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' armbian-config armbian-zsh 2>/dev/null || true; } | awk '$1 ~ /^.i/ {print $2}' | tr '\n' ' ')   # dpkg-query exits 1 for an unknown package; the hook runs under -e -o pipefail
		if [ -n "$pk" ]; then
			apt-get purge -y $pk || { echo "W: [pi-desktop] apt purge rc=$? - falling back to dpkg"; dpkg --purge --force-depends $pk || true; }
		else
			echo "I: [pi-desktop] nothing to purge"
		fi
		apt-get autoremove -y || true
		rm -f /etc/apt/sources.list.d/armbian-config.sources
		apt-get clean || true
		find /var/lib/apt/lists -type f ! -name lock -delete || true
		find /var/cache/apt -type f -delete || true
		echo "I: [pi-desktop] apt leftovers: lists=$(find /var/lib/apt/lists -type f | wc -l) cache=$(find /var/cache/apt -type f | wc -l)"
		if dpkg -l armbian-config 2>/dev/null | grep -q "^ii"; then echo "W: [pi-desktop] armbian-config STILL installed"; else echo "I: [pi-desktop] armbian-config gone"; fi
		true
	EOS
	)
	chroot_sdcard "${script}"
}

# (Removed for 4.5: a 2026-09-22 override pinned base-files 14ubuntu6.2 while Armbian's package-info feed lacked
# 'resolute'. The feed carries resolute again, and the pin would break the bake once Ubuntu replaced that version.)

# Kernel config hook: the framework's armbian_kernel_config hook forces RT_GROUP_SCHED=y
# (lib/functions/compilation/armbian-kernel.sh, "Enables real-time group scheduling"), which
# on a cgroup-v2 desktop makes SCHED_FIFO EPERM for every task (PipeWire, rtkit). A line in
# userpatches/linux-rk35xx-vendor.config cannot override it; a later-sorting hook can.
function armbian_kernel_config__zz_pidesktop_no_rt_group_sched() {
	# The framework's armbian_kernel_config__enable_docker_support hook queues RT_GROUP_SCHED in the
	# shared opts_y array, and armbian_kernel_config_apply_opts_from_arrays() applies the arrays AFTER
	# all hooks ran (opts_n first, then opts_y) — so a direct kernel_config_set_n here would be undone.
	# This hook sorts after the framework's: pull the option out of opts_y and queue it in opts_n.
	# The apply function also feeds kernel_config_modifying_hashes, so no manual hash entry is needed.
	declare -a _pd_keep=(); declare _pd_o
	for _pd_o in "${opts_y[@]}"; do [[ "${_pd_o}" == "RT_GROUP_SCHED" ]] || _pd_keep+=("${_pd_o}"); done
	opts_y=("${_pd_keep[@]}")
	opts_n+=("RT_GROUP_SCHED")
	display_alert "Pi-Desktop kernel config" "RT_GROUP_SCHED moved from opts_y to opts_n (SCHED_FIFO for audio)" "info"
}

# Kernel and boot-loader sources, pinned (whole-build Red Team: the branch head moved after 4.0 was built and would
# have pulled untested Orange Pi 5 changes into a bake). 4.5's kernel is Armbian's rk-6.1-rkr7.2 @ 44bbd021 merged with
# upstream stable v6.1.189 plus the vendor-driver interface fixes, in defcom5-rockchip/linux-rockchip; the Pi-Desktop
# patches in userpatches/kernel/ still apply on top. For a local bake from your own clone of that repository:
#   PIDESKTOP_KERNELSOURCE=file:///path/to/linux-rockchip  (the clone needs uploadpack.allowReachableSHA1InWant=true; a file:// source also needs a small local change to the framework's lib/functions/general/git-ref2info.sh — the stock framework only takes the https URL above)
PIDESKTOP_KERNEL_COMMIT="${PIDESKTOP_KERNEL_COMMIT:-f3411423c1e9e40340f13e18828e0b31b53d50ce}"
function post_family_config__pidesktop_pinned_sources() {
	[[ "${BRANCH}" == "vendor" ]] || return 0
	declare -g KERNELSOURCE="${PIDESKTOP_KERNELSOURCE:-https://github.com/defcom5-rockchip/linux-rockchip.git}"
	declare -g KERNELBRANCH="commit:${PIDESKTOP_KERNEL_COMMIT}"
	# U-Boot: the 5B uses the family's radxa vendor U-Boot, pinned as in 4.0. The Orange Pi 5 keeps Armbian's own choice for
	# that board (mainline v2026.04 with the SPI loader, set by its post_family_config__orangepi5_use_mainline_uboot hook,
	# which runs before this one): do not pin it.
	[[ "${BOARD}" == "orangepi5b" ]] && declare -g BOOTBRANCH="commit:39cd993e5d6296635438e84f4576b3a9bf76f86e"   # radxa/u-boot next-dev-v2024.10
	# Armbian's rtw88 backport (Realtek USB/SDIO Wi-Fi for 6.1) no longer applies to the 6.1.189 merge: stable already
	# carries one of its hunks. Pi-Desktop carries the same three patches, refreshed, as kernel/…/0012-0014.
	KERNEL_DRIVERS_SKIP+=(driver_rtw88)
	display_alert "Plaid Pi pinned sources" "board ${BOARD}; kernel ${KERNELSOURCE} @ ${PIDESKTOP_KERNEL_COMMIT:0:12}; u-boot ${BOOTBRANCH}" "info"
}

# Kernel hardening (maintainer decision 2026-10-09; whole-build Red Team, kernel review K8): Ubuntu's usual defaults.
# Yama is already listed in CONFIG_LSM but was not built. User namespaces stay on: GNOME's glycin/bwrap sandbox needs them.
# Hardened usercopy can catch real bugs in the vendor drivers (Mali, MPP, RGA) as "usercopy:" reports: soak before release.
function armbian_kernel_config__zz_pidesktop_hardening() {
	opts_y+=("SECURITY_YAMA" "HARDENED_USERCOPY" "SLAB_FREELIST_HARDENED" "SLAB_FREELIST_RANDOM" "INIT_ON_ALLOC_DEFAULT_ON")
	# The Mali kernel driver came as a debug build (146 KBASE_DEBUG_ASSERT -> BUG() sites, 3 s fence-debug timeouts).
	# The three below default to y when MALI_VALHALL_DEBUG is set and are already y in the config, so all four go.
	opts_n+=("MALI_VALHALL_DEBUG" "MALI_VALHALL_FENCE_DEBUG" "MALI_VALHALL_SYSTEM_TRACE" "MALI_VALHALL_ENABLE_TRACE")
	display_alert "Pi-Desktop kernel config" "hardening: Yama, hardened usercopy, slab freelist hardening/randomisation, init_on_alloc; Mali driver: release build" "info"
}

# apt policy at the very end of the bake. The framework rewrites the apt sources AFTER customize-image.sh
# (create_sources_list_and_deploy_repo_key "image-late", lib/functions/main/rootfs-image.sh): it puts Armbian's
# '<release>-desktop' component back (rebranded browser copies only) and Ubuntu's ports back to http, so the
# recipe's own edits never reached the image (4.0 shipped with both). Redo them here, where they stick.
function custom_apt_repo__pidesktop_apt_policy() {
	[[ "${CUSTOM_REPO_WHEN}" == "image-late" ]] || return 0
	local d="${SDCARD}/etc/apt/sources.list.d"
	sed -i 's|http://ports.ubuntu.com|https://ports.ubuntu.com|g' "${d}"/*.sources 2> /dev/null || true
	# apt.armbian.com over https too (the framework writes http): it redirects to an https mirror, which apt accepts
	# (tested on the development board 2026-10-09 with a throwaway lists dir). With an http source left, Pro Updates'
	# https-only default would skip every Armbian update.
	sed -i 's|http://apt.armbian.com|https://apt.armbian.com|g' "${d}"/*.sources 2> /dev/null || true
	if [[ -f "${d}/armbian.sources" ]]; then
		sed -i -E "s/^(Components: .*) ${RELEASE}-desktop( |\$)/\1\2/" "${d}/armbian.sources"
	fi
	display_alert "Pi-Desktop apt policy" "armbian: $(grep -h '^URIs\|^Components' "${d}/armbian.sources" 2> /dev/null | tr '\n' ' '); ubuntu: $(grep -h '^URIs' "${d}/ubuntu.sources" 2> /dev/null | sort -u | tr '\n' ' ')" "info"
}

# The customize script runs inside the image chroot and never sees this config's variables (test2 built as "test1").
# Hand the version over through the image itself; customize-image.sh reads /etc/pi-desktop-release.
function pre_customize_image__pidesktop_version() {
	echo "${PIDESKTOP_VERSION}" > "${SDCARD}/etc/pi-desktop-release"
	display_alert "Pi-Desktop version" "${PIDESKTOP_VERSION}" "info"
}
