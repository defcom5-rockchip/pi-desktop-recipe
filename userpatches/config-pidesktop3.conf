# Pi-Desktop 4.0 "Plaid" — Ubuntu 26.04 "Resolute" packages + GNOME 50 on the Rockchip vendor 6.1 (rkr7.2) kernel, Armbian framework
# Per Pi Claude's build request 2026-09-21 (Route B). Run: sudo env PREFER_DOCKER=no ./compile.sh pidesktop3
BOARD=orangepi5b
BRANCH=vendor                 # armbian/linux-rockchip rk-6.1-rkr7.2 (6.1.172) + userpatches/kernel/rk35xx-vendor-6.1 (our 4K@120 trio)
RELEASE=resolute
BUILD_DESKTOP=yes
DESKTOP_ENVIRONMENT=gnome     # configng gnome.yaml (GNOME 50.1, gdm3)
DESKTOP_TIER=mid              # minimal/mid/full. mid since test9 (2026-10-02): full added LibreOffice, GIMP, Inkscape, Thunderbird,
                              # Audacity and Microsoft's VS Code build (telemetry on) and pushed the image past GitHub's 2 GiB release
                              # limit (test8 = 2.26 GB). Those apps now install on first click (customize-image.sh: pidesktop-get);
                              # Audacity is installed explicitly; VS Code is replaced by VSCodium.
BUILD_MINIMAL=no
KERNEL_CONFIGURE=no
INSTALL_HEADERS=yes
EXPERT=yes                    # orangepi5b is a .csc (community) board in current upstream
SHARE_LOGS=no
COMPRESS_OUTPUTIMAGE=sha,img
IMAGE_XZ_COMPRESSION_RATIO=1
PREFER_DOCKER=no              # native build on the resolute x86 host (host-release.sh lists resolute)

# Identity (framework knobs; the rest is done in customize-image.sh)
VENDOR="Pi-Desktop"
VENDORURL="https://defcom5-rockchip.github.io/pi-desktop/"
VENDORPRIVACY="https://defcom5-rockchip.github.io/pi-desktop/privacy.html"   # our own page (the framework default is duckduckgo.com)
VENDORLOGO="pi-desktop"       # icon name installed by customize-image.sh (branding/); the framework default is armbian-logo
VENDORSUPPORT="https://github.com/defcom5-rockchip"
VENDORDOCS="https://github.com/defcom5-rockchip/pi-desktop"
VENDORBUGS="https://github.com/defcom5-rockchip/pi-desktop/issues"
VENDORCOLOR="255;105;180"

# Our layer (read by customize-image.sh)
PIDESKTOP_VERSION="4.0 Plaid"
PIDESKTOP_GPU_STACK="mali"    # mali = libmali G610 g24p0 wayland-gbm (+ device-query shim) on kbase g29p1 (THE test); mesa = leave stock Mesa (llvmpipe control)

# Armbian's armbian-config extension (enabled unconditionally in main-config.sh) installs armbian-config AFTER
# customize-image.sh. Run after it in the same hook phase and take it back out, leaving apt lists clean.
# chroot_sdcard joins its args into ONE string and runs it via `bash -e -o pipefail -c` inside the rootfs, so the
# script is handed over as a single string and every fallible line carries `|| …` (which -e respects).
function post_armbian_repo_customize_image__zz_pidesktop_strip_armbian_config() {
	display_alert "Pi-Desktop" "purging armbian-config / armbian-zsh installed by framework hooks" "info"
	local script
	script=$(cat <<-'EOS'
		export DEBIAN_FRONTEND=noninteractive
		dpkg -l armbian-config armbian-zsh 2>&1 | grep "^.i" || echo "I: [pi-desktop] nothing to purge"
		apt-get purge -y armbian-config armbian-zsh || { echo "W: [pi-desktop] apt purge rc=$? - falling back to dpkg"; dpkg --purge --force-depends armbian-config armbian-zsh || true; }
		apt-get autoremove -y || true
		rm -f /etc/apt/sources.list.d/armbian-config.sources
		apt-get clean || true
		find /var/lib/apt/lists -type f ! -name lock -delete || true
		find /var/cache/apt -type f -delete || true
		echo "I: [pi-desktop] apt leftovers: lists=$(find /var/lib/apt/lists -type f | wc -l) cache=$(find /var/cache/apt -type f | wc -l)"
		if dpkg -l armbian-config 2>/dev/null | grep -q "^ii"; then echo "W: [pi-desktop] armbian-config STILL installed"; else echo "I: [pi-desktop] armbian-config gone"; fi
		true
	EOS
	)
	chroot_sdcard "${script}"
}

# 2026-09-22: Armbian's package-info feed (github.armbian.com/base-files.json) dropped the 'resolute' key, so the
# framework's base-files lookup fails 10x and aborts. Resolve it ourselves from Launchpad/ports (resolute-updates
# 14ubuntu6.2, verified present on ports.ubuntu.com) and defer everything else to the original function.
if declare -f apt_find_upstream_package_version_and_download_url >/dev/null; then
	eval "orig_$(declare -f apt_find_upstream_package_version_and_download_url)"
fi
function apt_find_upstream_package_version_and_download_url() {
	if [[ "${1}" == "base-files" && "${RELEASE}" == "resolute" && "${ARCH}" == "arm64" ]]; then
		found_package_version="14ubuntu6.2"
		found_package_filename="base-files_14ubuntu6.2_arm64.deb"
		found_package_down_url="http://ports.ubuntu.com/pool/main/b/base-files/${found_package_filename}"
		display_alert "Pi-Desktop" "base-files for resolute pinned locally: ${found_package_filename} (Armbian feed lacks resolute)" "info"
		return 0
	fi
	orig_apt_find_upstream_package_version_and_download_url "$@"
}

# Kernel config hook: the framework's armbian_kernel_config hook forces RT_GROUP_SCHED=y
# (lib/functions/compilation/armbian-kernel.sh, "Enables real-time group scheduling"), which
# on a cgroup-v2 desktop makes SCHED_FIFO EPERM for every task (PipeWire, rtkit). A line in
# userpatches/linux-rk35xx-vendor.config cannot override it; a later-sorting hook can.
function armbian_kernel_config__zz_pidesktop_no_rt_group_sched() {
	# The framework's armbian_kernel_config__enable_docker_support hook queues RT_GROUP_SCHED in the
	# shared opts_y array, and armbian_kernel_config_apply_opts_from_arrays() applies the arrays AFTER
	# all hooks ran (opts_n first, then opts_y) — so a direct kernel_config_set_n here would be undone.
	# This hook sorts after the framework's: pull the option out of opts_y and queue it in opts_n.
	# The apply function also feeds kernel_config_modifying_hashes, so no manual hash entry is needed.
	declare -a _pd_keep=(); declare _pd_o
	for _pd_o in "${opts_y[@]}"; do [[ "${_pd_o}" == "RT_GROUP_SCHED" ]] || _pd_keep+=("${_pd_o}"); done
	opts_y=("${_pd_keep[@]}")
	opts_n+=("RT_GROUP_SCHED")
	display_alert "Pi-Desktop kernel config" "RT_GROUP_SCHED moved from opts_y to opts_n (SCHED_FIFO for audio)" "info"
}

# The customize script runs inside the image chroot and never sees this config's variables (test2 built as "test1").
# Hand the version over through the image itself; customize-image.sh reads /etc/pi-desktop-release.
function pre_customize_image__pidesktop_version() {
	echo "${PIDESKTOP_VERSION}" > "${SDCARD}/etc/pi-desktop-release"
	display_alert "Pi-Desktop version" "${PIDESKTOP_VERSION}" "info"
}
