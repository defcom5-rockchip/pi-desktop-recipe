# Pi-Desktop: cap unwritten file data. The kernel defaults (dirty_ratio 20%, about 3 GB on a 16 GB board) let a fast
# source such as the NAS pile gigabytes of dirty pages in front of a slow target (SD card, USB 2.0 drive). Writeback
# then stalls reclaim and memory pressure spikes, which is what systemd-oomd acts on (session killed 2026-09-26).
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
