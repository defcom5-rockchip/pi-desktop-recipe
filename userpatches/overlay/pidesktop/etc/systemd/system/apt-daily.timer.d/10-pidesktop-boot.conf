# Plaid Pi: Ubuntu's timer fires at boot in two ways. Persistent=true runs a missed day the moment the system boots (first
# boot of a week-old image, 2026-11-01: ~140 packages while the first-login wizard sat at "Waiting for system to finish
# booting"). And the calendar schedule fires when the clock jumps forward: a board whose RTC has no backup power boots in
# 2021 and chrony steps the clock to today 20 s later (2026-11-08: download + upgrade ran for four minutes at the same
# prompt even with Persistent=false). So: boot-relative only. OnCalendar= clears Ubuntu's schedule; the run happens 15
# minutes after boot and then once a day, spread over an hour instead of Ubuntu's twelve.
[Timer]
Persistent=false
OnCalendar=
OnBootSec=15min
OnUnitActiveSec=1d
RandomizedDelaySec=1h
