# Plaid Pi: Ubuntu's Persistent=true makes a missed daily run fire the moment the system boots. On a first boot of a
# week-old image that downloaded + installed ~140 packages while the first-login wizard sat at "Waiting for system to
# finish booting" (systemctl is-system-running --wait) — 2026-11-01. Run 15 minutes after boot and at the usual times.
[Timer]
Persistent=false
OnBootSec=15min
