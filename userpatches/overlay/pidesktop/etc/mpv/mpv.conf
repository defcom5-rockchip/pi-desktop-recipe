# Pi Desktop 2.0.2: zero-copy VA-API first (8- and 10-bit display correctly since
# driver 2.1.3), copy-back as fallback. Never plain hwdec=auto: mpv would pick its own
# rkmpp path, whose bare NV15 output the GPU stack cannot import (blue screen).
hwdec=vaapi,vaapi-copy
# 4K60 on GNOME Wayland: mpv's default audio-sync mode drops ~2/3 of the frames as
# 'late' even though decode and GPU keep up (measured 605/900 dropped on 4K60 HDR10);
# display-resample presents every frame on a vsync: 0 dropped in the same test.
video-sync=display-resample

# Discs (Pi-Desktop, measured 2026-09-26 on 4K@120 with a CSS concert DVD): display-resample redraws the full 4K
# frame on every vsync; at 120 Hz that saturated the Mali (123 dropped/min, GPU 93%). Audio sync draws only when the
# picture changes: 0 dropped, GPU 43%, and GPU deinterlacing of interlaced DVD video still fits (0 dropped, GPU 74%).
# mpv auto-loads protocol.<name> profiles, so normal files keep display-resample.
[protocol.dvd]
profile-desc=Pi-Desktop: DVDs (interlaced SD) - draw only when the picture changes, deinterlace when interlaced
video-sync=audio
deinterlace=auto

[protocol.bd]
profile-desc=Pi-Desktop: Blu-ray - draw only when the picture changes
video-sync=audio

[protocol.bluray]
profile=protocol.bd
