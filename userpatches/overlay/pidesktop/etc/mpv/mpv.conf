# Pi-Desktop mpv configuration. Measurements behind these settings: KNOWN-ISSUES.md (VID-5 to VID-7) and CHANGELOG.md.
# Never plain hwdec=auto: mpv would pick its own rkmpp path, whose bare NV15 output the GPU stack cannot import.
# Decoding: the recipe writes the line below for the installed driver and mpv. With rockchip-vaapi >= 2.5.0 and
# Pi-Desktop's mpv build it reads `hwdec=vaapi,vaapi-copy` (zero-copy first; that build draws 8- and 10-bit correctly
# on the Mali driver). With any other mpv it stays `hwdec=vaapi-copy`: Ubuntu's mpv draws 10-bit near-black on this GPU
# driver (VID-7), and drivers before 2.5.0 leaked decoder buffers on every abandoned zero-copy attempt.
hwdec=vaapi-copy
# A profile or keypress that changes hwdec lasts for one file only; each new file starts from the line above.
reset-on-next-file=hwdec
# The Mali driver's Vulkan cannot present, and mpv's automatic renderer choice then falls back to software rendering.
gpu-api=opengl
# Audio sync draws a frame only when the picture changes. display-resample redraws on every vsync, which at 4K@120 is
# more than the GPU can do with heavy 4K60 video (it fell behind real time). The disc profiles below use the same.
video-sync=audio
# Colour (chroma) upscaling: mpv's default (lanczos) on the colour planes of 4K60 video keeps the Mali-G610 saturated
# and drops frames; bilinear does not. Brightness (luma) scaling and dithering stay at mpv's defaults.
cscale=bilinear

# Discs: audio sync draws only when the picture changes, which leaves room for GPU deinterlacing of interlaced DVD video.
# mpv auto-loads protocol.<name> profiles (same sync as normal files; kept for the deinterlace setting).
# Films from network shares (GVFS, CIFS, NFS): mpv already turns its cache on for these filesystems; give it room to
# ride out a NAS pause even in high-bitrate scenes (the 150 MiB default is ~30 s at 40 Mbit/s). Local files are unaffected.
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB
cache-pause-wait=10

[protocol.dvd]
profile-desc=Pi-Desktop: DVDs (interlaced SD) - draw only when the picture changes, deinterlace when interlaced
video-sync=audio
deinterlace=auto

[protocol.bd]
profile-desc=Pi-Desktop: Blu-ray - draw only when the picture changes
video-sync=audio

[protocol.bluray]
profile=protocol.bd

# >>> pidesktop-10bit-copyback (the recipe deletes this block when Pi-Desktop's mpv is installed)
# 10-bit zero-copy draws near-black on the Mali GL driver with an mpv that samples the imported planes directly: the
# driver imports the luma plane of a 10-bit frame (DRM_FORMAT_R16) as an integer texture (GL_R16UI), which a video
# shader reads as 0 (VID-7). With Ubuntu's mpv the image keeps hwdec=vaapi-copy, so this profile only matters if
# someone sets hwdec=vaapi by hand: it then sends 10-bit to copy-back. profile-restore=default keeps copy-back for the
# rest of the file (with `copy` the condition goes false after the switch and mpv restores into software decoding);
# reset-on-next-file above gives the next file a fresh start.
[pidesktop-10bit-copyback]
profile-desc=Pi-Desktop: 10-bit video through copy-back (the Mali driver samples imported 16-bit luma as 0)
profile-cond=p["video-params/hw-pixelformat"] == "p010"
profile-restore=default
hwdec=vaapi-copy
# <<< pidesktop-10bit-copyback
