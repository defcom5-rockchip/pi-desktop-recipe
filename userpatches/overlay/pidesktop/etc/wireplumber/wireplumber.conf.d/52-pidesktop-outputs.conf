# Pi-Desktop: name the board's sound outputs and make HDMI the default.
# Out of the box all three cards are "Built-in Audio" at priority 1000, so the tie goes to card 0 =
# dp0-sound (DisplayPort over USB-C), which is silent on an HDMI monitor. Measured by ear on test2
# 2026-09-24 at 4K@60 and 4K@120: hdmi0-sound plays on the monitor, dp0-sound does not.
# Node names are unchanged, so pidesktop-headphone-follow (matches by name) is unaffected.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-hdmi0-sound" } ]
    actions = { update-props = { device.description = "HDMI" } }
  }
  {
    matches = [ { device.name = "alsa_card.platform-dp0-sound" } ]
    actions = { update-props = { device.description = "DisplayPort (USB-C)" } }
  }
  {
    matches = [ { device.name = "alsa_card.platform-es8388-sound" } ]
    actions = { update-props = { device.description = "3.5 mm Jack" } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-hdmi0-sound.*" } ]
    actions = { update-props = { node.description = "HDMI", priority.session = 1100, priority.driver = 1100 } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-dp0-sound.*" } ]
    actions = { update-props = { node.description = "DisplayPort (USB-C)", priority.session = 900, priority.driver = 900 } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-es8388-sound.*" } ]
    actions = { update-props = { node.description = "Headphones (3.5 mm)" } }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-es8388-sound.*" } ]
    actions = { update-props = { node.description = "Microphone (3.5 mm)" } }
  }
]
