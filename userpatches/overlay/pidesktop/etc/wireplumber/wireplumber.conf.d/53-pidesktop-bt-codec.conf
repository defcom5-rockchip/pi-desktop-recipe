# Pi-Desktop: prefer the SBC-XQ profile for Bluetooth speakers/headphones. 51-bluez-sbcxq.conf only enables the codec; PipeWire
# ranks plain SBC (profile priority 130) above SBC-XQ (129), so a fresh pairing landed on SBC (KDE 5B card, 2026-11-01). WirePlumber's
# find-best-profile gives device.profile precedence when the device offers that profile, and a profile the user picks by hand
# (plain SBC, or AAC with the add-on) is remembered across reconnects — tested: rule -> sbc_xq; user picks sbc -> stays sbc.
monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = { update-props = { device.profile = "a2dp-sink-sbc_xq" } }
  }
]
